# MOISE (Bank of Israel, Argov et al. 2012, DP 2012.06): log-linearized model.
# Independent replication; not affiliated with the Bank of Israel.
#
# Format: docs/equation-spec.md. Source: docs/paper/ (Appendix D equations, Appendix C steady state,
# Tables 1-4). Code names: docs/paper/data/notation_codes.csv.
#
# Each Appendix D equation keeps the paper's code form in `printed` (verbatim from
# docs/paper/10-log-linear-model.md). `expr` is what the solver uses; it differs from `printed` only
# where a decision (see `decisions`) applies. Load with a decision set to 'printed' to get the paper's
# version back. Nothing here is verified by a person yet (verified: false everywhere).

meta:
  title: MOISE log-linearized model
  source: 'Argov, Barnea, Binyamini, Borenstein, Elkayam & Rozenshtrom (2012), Bank of Israel DP 2012.06'
  paper_url: 'https://boi.org.il/media/ybvpydng/dp12065e.pdf'
  appendix_equations: D
  appendix_steady_state: C
  status: draft
  parameter_values: 'value = posterior mode (Tables 2-4) or calibration (Table 1, text); posterior_mean is also given'
  shock_size: 'std = posterior mode of the innovation S.D.; impulse responses use one S.D.'
  timing: 'x = x_t, x(+1) = E_t x_{t+1}, x(-1) = x_{t-1}; ^ is a power'
  units: 'hatted variables are log deviations from the steady state; shares (s_X, s_IM, s_TB, CA_over_Y, dinv, tax rates) are level deviations'

decisions:
  - id: D01
    title: 'π̄ without a hat is the inflation-target deviation π̂̄'
    status: proposed
    applies_to: ['(259)', '(298)', '(299)', '(304)', '(305)', '(306)']
    printed: 'Some equations print the target as \bar{\pi}_t (no hat), others as \hat{\bar{\pi}}_t.'
    adopted: 'Alias pibar_nohat -> pibar.'
    alternatives: []
    rationale: '(62) prints the hat in the policy rule; Appendix B text says the exchange-rate and wage observation equations subtract the target deviation; (300) only makes sense with the deviation.'
    reviewed_by: null
  - id: D02
    title: 'Foreign inflation target is constant'
    status: proposed
    applies_to: ['(217)', '(248)', '(287)', '(318)']
    printed: '\hat{\bar{\pi}}^{*}_t (and \bar{\pi}^{*}_t) appear, but no process or shock is given for them.'
    adopted: 'pibar_star fixed at zero; pibar_star_nohat is an alias of pibar_star.'
    alternatives: []
    rationale: 'None of the 25 shocks of Section 4.4.2 moves the foreign target, and no law of motion is printed.'
    reviewed_by: null
  - id: D03
    title: 's_{B^*} without a hat is the NFA-ratio deviation'
    status: proposed
    applies_to: ['(272)']
    printed: '(272) writes s_{B^*_{t+1}} = r^*[...] without hats.'
    adopted: 'Alias s_Bstar_nohat -> s_Bstar (steady-state NFA is zero, 109.i9, so level = deviation).'
    alternatives: []
    reviewed_by: null
  - id: D04
    title: '(273) defines the real exchange rate in CPI terms as a new variable'
    status: proposed
    applies_to: ['(273)']
    printed: '\hat{s}_t = \hat{c}_t + \hat{p}_{Y,t}'
    adopted: 's_C = s + p_Y, with s_C a new variable (CPI-based real exchange rate).'
    alternatives: []
    rationale: 's_t = P*_Y S/P_Y (123.i1), so the CPI-based rate is s*p_Y. Read literally, (273) would tie the real exchange rate to consumption and leave the system with one equation too many.'
    reviewed_by: null
  - id: D05
    title: '(282), (284): ĉ in the export-value term is ŝ'
    status: proposed
    applies_to: ['(282)', '(284)']
    printed: '(... )(\hat{c}_t + \hat{p}_{X,t} + \hat{p}_{Y,t} + \hat{x}_t)'
    adopted: '\hat{s}_t in place of \hat{c}_t'
    alternatives: [printed]
    rationale: 'Export value is S P_X X (84), (152), (154); (280) prints \hat{s} in the same term.'
    evidence: 'Figures 6-18: mean relative RMSE 0.056 adopted vs 0.174 printed.'
    reviewed_by: null
  - id: D06
    title: '(288): the last term is the foreign cost-push shock'
    status: proposed
    applies_to: ['(288)']
    printed: '... + \hat{\pi}^{*}_{Y,t} (the left-hand variable again)'
    adopted: '+ epsilon_Pistar, an AR(1) shock (rho_Pistar, eta_Pistar from Table 4), as in (92).'
    alternatives: [printed]
    evidence: 'Printed form makes the model indeterminate (one stable root too many).'
    reviewed_by: null
  - id: D07
    title: '(290): sign of the lagged oil-price change'
    status: proposed
    applies_to: ['(290)', '(93)']
    printed: 'Appendix D (290): - c_{OIL,Δ}(p_{t-1} - p_{t-2}); main text (93): + c_{oil,Δ}(...)'
    adopted: 'Appendix D sign (printed). See notes for the evidence from Figure 13.'
    alternatives: [main_text]
    rationale: 'The estimate is negative (mode -0.415), so the sign changes the dynamics. With the Appendix D sign the oil price is a hump-shaped AR(2) (roots modulus 0.64); with (93) it oscillates.'
    evidence: 'Figures 6-18: mean relative RMSE 0.056 with the Appendix D sign vs 0.082 with the sign of (93).'
    reviewed_by: null
  - id: D08
    title: '(262): the ellipsis is expanded with the Appendix D indices'
    status: proposed
    applies_to: ['(262)', '(63)']
    printed: '\frac{1}{20}E_t(\hat{ri}_{t+20} + ... + \hat{ri}_{t+39}); (63) has t+21 ... t+40'
    adopted: 'rr_fw = (1/20) * sum of ri(+20) ... ri(+39), written out term by term.'
    alternatives: [main_text]
    evidence: 'No visible effect on Figures 6-18.'
    reviewed_by: null
  - id: D09
    title: '(265): keep the factor 0.25'
    status: proposed
    applies_to: ['(265)', '(65)']
    printed: '(265) has 0.25[...]; (65) prints the plain sum.'
    adopted: '0.25 (average quarterly inflation, same units as the quarterly target in (259)).'
    alternatives: [main_text]
    evidence: 'Figures 6-18: mean relative RMSE 0.056 adopted vs 0.172 with the plain sum of (65).'
    reviewed_by: null
  - id: D10
    title: 'Inflation-target persistence ρ_π̄ = 0.99'
    status: proposed
    applies_to: ['(260)', '(64)']
    printed: '(260) writes a parameter ρ_{\bar{\pi}}; (64) fixes it at 0.99.'
    adopted: 'rho_barpi = 0.99 (64).'
    alternatives: []
    reviewed_by: null
  - id: D11
    title: '(212), (284): VAT term numerator kept as printed'
    status: proposed
    applies_to: ['(212)', '(284)']
    printed: '\frac{1}{1+0.78\tau^c}\hat{\tau}^C'
    adopted: 'As printed (numerator 1).'
    alternatives: [w_tauC]
    rationale: 'Log-linearizing (5) gives w_{τ^C}/(1+w_{τ^C}τ^C) = 0.78/(1+0.78*0.16) if \hat{τ}^C is the level deviation of the VAT rate, as in (314). Only the scale of the VAT shock is affected. Alternative ''w_tauC'' uses 0.78 in the numerator in both equations.'
    evidence: 'No effect on Figures 6-18 (VAT shock only).'
    reviewed_by: null
  - id: D12
    title: '(214): ĝ_z terms and the exponent of g_z'
    status: proposed
    applies_to: ['(214)']
    printed: '(\beta\omega(1-\omega)\hat{g}_{z,t} - 1) + \omega\hat{g}_{z,t-1}; exponent 2(1-\omega)'
    adopted: '(\beta\omega(1-\omega) - 1)\hat{g}_{z,t} - \omega\hat{g}_{z,t-1}; exponent 2(1+\omega)'
    alternatives: [printed]
    rationale: 'Log-linearizing (9)-(11) with (10) and 10.u1 (done twice independently, symbolically and by finite differences) reproduces every other coefficient of (214) and gives these three. The printed ''-1'' is a constant that would shift the steady state.'
    evidence: 'No visible effect on Figures 6-18 (no figure for the permanent-technology shock); adopted on the derivation.'
    reviewed_by: null
  - id: D13
    title: '(217): (1-γ_S) on the expected inflation differential'
    status: proposed
    applies_to: ['(217)']
    printed: 'coefficient 1 on E_t(\hat{\pi}_{Y,t+1} - \hat{\pi}^{*}_{Y,t+1})'
    adopted: '(1 - gamma_S) on that term'
    alternatives: [printed]
    rationale: 'From (4), (6), (7) the premium multiplies the whole expected nominal depreciation E(s_{t+1} - s_t + π_{Y,t+1} - π*_{Y,t+1}), so the real-exchange-rate part and the inflation part must carry the same coefficient (1-γ_S).'
    evidence: 'Figures 6-18: mean relative RMSE 0.056 adopted vs 0.078 printed.'
    reviewed_by: null
  - id: D14
    title: '(225): denominators 1 + ν^f(R-1)'
    status: proposed
    applies_to: ['(225)']
    printed: '1 - \nu^f(R-1) twice'
    adopted: '1 + \nu^f(R-1) (steady state of R^F, (119)/(170))'
    alternatives: [printed]
    evidence: 'No visible effect on Figures 6-18.'
    reviewed_by: null
  - id: D15
    title: '(233): ν_E is ν_C'
    status: proposed
    applies_to: ['(233)']
    printed: '\frac{\nu_E}{1-\nu_E}\hat{\nu}_{C,t}'
    adopted: 'nu_C_ss in place of nu_E (as (237), (241), (245) use their own sector''s ν).'
    alternatives: []
    rationale: 'ν_E is not defined anywhere in the paper, so the printed form cannot be evaluated.'
    reviewed_by: null
  - id: D16
    title: '(246): ε^X kept as printed (no numerical effect)'
    status: proposed
    applies_to: ['(246)']
    printed: '\hat{\epsilon}^{X}_t where (234), (238), (242) have \hat{\epsilon}^{IM}_t'
    adopted: 'As printed; both epsilon_X and epsilon_IM are fixed at zero (D25).'
    alternatives: []
    reviewed_by: null
  - id: D17
    title: '(248): lagged export-price inflation term'
    status: proposed
    applies_to: ['(248)']
    printed: '\frac{\chi_X}{1+\beta\chi_X}[E_t(\hat{\bar{\pi}}^{*}_{t+1}) - \hat{\bar{\pi}}^{*}_t] (the same bracket twice)'
    adopted: '\frac{\chi_X}{1+\beta\chi_X}(\hat{\pi}_{X,t-1} - \hat{\bar{\pi}}^{*}_t), the term (226) and (229) have in this position'
    alternatives: [printed]
    rationale: 'With indexation χ_X the lagged own inflation must appear; as printed χ_X only multiplies terms in the (constant) foreign target.'
    evidence: 'Figures 6-18: mean relative RMSE 0.056 adopted vs 0.059 printed (weak evidence); adopted on the derivation.'
    reviewed_by: null
  - id: D18
    title: '(280): government-spending weight p_G g/(p_Y y)'
    status: proposed
    applies_to: ['(280)']
    printed: '\frac{p_G g}{p_Y g}'
    adopted: '\frac{p_G g}{p_Y y} (as in (284))'
    alternatives: [printed]
    evidence: 'Figures 6-18: mean relative RMSE 0.056 adopted vs 0.118 printed.'
    reviewed_by: null
  - id: D19
    title: '(300): left-hand side is the observed domestic target'
    status: proposed
    applies_to: ['(300)', '94.i5']
    printed: '4\bar{\pi}^{*}_t = 4(\bar{\pi}_t + \pi - 1)'
    adopted: 'pibar_OB = 4*(pibar + pi_ss - 1); pibar_OB is the observable 4·π̄_t of 94.i5 / Appendix A.'
    alternatives: []
    reviewed_by: null
  - id: D20
    title: '(306): ĉ in the depreciation equation is ŝ'
    status: proposed
    applies_to: ['(306)', '(105)']
    printed: '\hat{c}_t - \hat{c}_{t-1}'
    adopted: '\hat{s}_t - \hat{s}_{t-1} (as (105) and (263))'
    alternatives: [printed]
    reviewed_by: null
  - id: D21
    title: 'Shock processes not printed in Appendix D are added from Section 3 and 4.4.2'
    status: proposed
    applies_to: ['(18)', '(20)', '(3)', '3.u1', '(89)-(94)', '4.4.2']
    printed: 'Appendix D uses \hat{\epsilon}_t, \hat{g}_{z,t}, \hat{\epsilon}^{C}_t, ... as given processes.'
    adopted: 'Each is a log-AR(1) x = rho*x(-1) + eta (footnotes 4 and 26), with ρ and S.D. from Tables 2-4 or the fixed values printed in the text.'
    alternatives: []
    reviewed_by: null
  - id: D22
    title: 'One home-bias process for all final-good sectors'
    status: proposed
    applies_to: ['(232)-(247)', '4.4.2 item 11']
    printed: '\hat{\nu}_{C}, \hat{\nu}_{I}, \hat{\nu}_{G}, \hat{\nu}_{X} appear separately.'
    adopted: 'nu_C, nu_I, nu_G, nu_X are aliases of one process nu (rho_nu, eta_nu).'
    alternatives: []
    reviewed_by: null
  - id: D23
    title: 'Relative technology z̃ is constant'
    status: proposed
    applies_to: ['(271)', '(307)', '(319)']
    printed: '\hat{\tilde{z}}_t appears without a process.'
    adopted: 'ztilde fixed at zero (Table 1 calibrates \tilde{z} = 1; no shock among the 25 moves it).'
    alternatives: []
    reviewed_by: null
  - id: D24
    title: 'Competitors'' export price is constant'
    status: proposed
    applies_to: ['(271)', '(310)', '94.i1']
    printed: '\hat{p}^{*}_{x,t} appears in (271) and (310).'
    adopted: 'p_x_star fixed at zero: 94.i1 sets p^{c,*}_{X,t} = 1.'
    alternatives: []
    reviewed_by: null
  - id: D25
    title: 'Shocks the estimated model does not use are fixed at zero'
    status: proposed
    applies_to: ['(220)', '(221)', '(225)', '(234)', '(238)', '(242)', '(246)', '4.4.2']
    printed: '\hat{\epsilon}_{N}, \hat{\epsilon}^{IM}, \hat{\epsilon}^{X}, \hat{\epsilon}^{F}, \hat{\nu}_{f}'
    adopted: 'All fixed at zero. 4.4.2: ε^N is replaced by φ^W (item 14), ε^IM is not used (item 11), ε^X is replaced by ν* (item 10); ε^F and ν_f are not among the 25 shocks.'
    alternatives: []
    reviewed_by: null
  - id: D26
    title: 'Tax rates other than VAT do not move'
    status: proposed
    applies_to: ['(253)-(257)']
    printed: 'AR(1) processes with ρ_τ and η_τ for τ^D, τ^K, τ^N, τ^{W_h}, τ^{W_f}'
    adopted: 'Kept as printed with ρ = 0 and innovation S.D. 0 (no values in the paper; not among the 25 shocks).'
    alternatives: []
    reviewed_by: null
  - id: D27
    title: 'Foreign real rate ri* defined from (89)'
    status: proposed
    applies_to: ['(286)', '(89)']
    printed: '(286) uses \widehat{ri}^{*}_t without a definition.'
    adopted: 'ri_star = r_star - pi_Y_star(+1), the term in (89).'
    alternatives: []
    reviewed_by: null
  - id: D28
    title: '(312): the domestic forward rate observes the domestic rr^{fwd}'
    status: proposed
    applies_to: ['(312)', '(108)']
    printed: '\hat{fw}_{ri^{*},t} (the foreign forward rate)'
    adopted: 'rr_fw, as in (108) and the Appendix A description (derived from Israeli indexed bonds).'
    alternatives: [printed]
    reviewed_by: null
  - id: D29
    title: 'Foreign discount factor β* = β'
    status: proposed
    applies_to: ['(229)', '(169)']
    printed: 'β* appears in (229) without a value; (169) prices R* with the domestic β.'
    adopted: 'beta_star = beta.'
    alternatives: []
    reviewed_by: null
  - id: D30
    title: 'Excess trends in depreciation and wages are i.i.d.'
    status: proposed
    applies_to: ['(320)', '(321)']
    printed: 'AR(1) with ρ^{ΔS}_{EX}, ρ^{ΔW}_{EX}'
    adopted: 'ρ = 0: Appendix B says EX^S and EX^W are i.i.d., and Table 3 reports only their S.D.s.'
    alternatives: []
    reviewed_by: null
  - id: D31
    title: 'Observation errors are AR(1)'
    status: proposed
    applies_to: ['(297)', '(301)', '(312)', '(318)']
    printed: '\hat{\epsilon}_{OB\_DPY}, \hat{\epsilon}_{OB\_E}, \hat{\epsilon}_{fwd\_ob}, \hat{\epsilon}_{fwd\_ob^*} appear without processes.'
    adopted: 'AR(1) with ρ_{OB,ΔY}, ρ_{OB,E}, ρ_{OB,fwd}, ρ_{OB,fwd*} and the S.D.s of Table 3.'
    alternatives: []
    reviewed_by: null
  - id: D32
    title: 'γ_{u,1} uses g_z/β'
    status: proposed
    applies_to: ['(115)', '115.u2', '172.u1', '(213)']
    printed: '\gamma_{u,1} = [\beta/g_z - (1-\delta+\tau^K\delta)](1-\tau^K)^{-1} (≈ 0.005)'
    adopted: '[g_z/\beta - (1-\delta+\tau^K\delta)](1-\tau^K)^{-1} (≈ 0.035), implied by 114.u1 and by the steady state of (213)'
    alternatives: [printed]
    evidence: 'Printed value (0.005) makes steady-state consumption negative (c/N = -1.02 in (179)); adopted value gives c/y = 0.55, i/y = 0.21.'
    reviewed_by: null
  - id: D33
    title: '(200): exponent -μ_X'
    status: proposed
    applies_to: ['(131)', '(200)']
    printed: '-\mu_G'
    adopted: '-\mu_X (as (245)); no numerical effect because p_IM/p_DX = 1 at the steady state.'
    alternatives: []
    reviewed_by: null
  - id: D34
    title: 'Long-run growth rates for the measurement block'
    status: proposed
    applies_to: ['(321)-(330)', '4.4.1']
    printed: 'Annual % rates in 4.4.1 (hours 0.7, consumption 1.7, ...); g_{ΔW} is not reported.'
    adopted: 'Quarterly gross rates 1 + annual/400; g_ΔN is a net quarterly rate 0.007/4 (it is added to growth rates in (291)-(303)). g_ΔW = g_z + π - 1 (no excess wage trend) - TODO: no value in the paper.'
    alternatives: []
    reviewed_by: null
  - id: D35
    title: 'Unreported innovation S.D.s are zero'
    status: proposed
    applies_to: ['(253)-(257)', '(299)', '(327)']
    printed: 'η^{τ^D}, η^{τ^K}, η^{τ^N}, η^{τ^{W_h}}, η^{τ^{W_f}}, η^{ΔP_I}, η^{ΔINV}_{EX}'
    adopted: 'S.D. 0 (TODO: not reported in Tables 2-4).'
    alternatives: []
    reviewed_by: null

variables:
  - name: lambda
    paper_symbol: '\hat{\lambda}'
    description: 'marginal utility of consumption (Lagrange multiplier), log deviation'
    block: households
  - name: c
    paper_symbol: '\hat{c}'
    description: 'private consumption (detrended), log deviation'
    block: households
  - name: Q
    paper_symbol: '\hat{Q}'
    description: 'Tobin''s Q (real price of installed capital), log deviation'
    block: households
  - name: i
    paper_symbol: '\hat{\imath}'
    description: 'investment (detrended), log deviation'
    block: households
  - name: r_k
    paper_symbol: '\hat{r}_{k}'
    description: 'real rental rate of capital, log deviation'
    block: households
  - name: u
    paper_symbol: '\hat{u}'
    description: 'capital utilization intensity, deviation'
    block: households
  - name: k
    paper_symbol: '\hat{k}'
    description: 'capital stock (detrended), log deviation'
    block: households
    predetermined: true
    notes: 'beginning-of-period capital stock: (218) is written k(+1) = f(k, ...)'
  - name: r
    paper_symbol: '\hat{r}'
    description: 'domestic nominal policy interest rate, deviation'
    block: households
  - name: ri
    paper_symbol: '\widehat{ri}'
    description: 'real interest rate (nominal rate minus next-period CPI inflation)'
    block: households
  - name: s
    paper_symbol: '\hat{s}'
    description: 'real exchange rate, log deviation'
    block: households
  - name: s_Bstar
    paper_symbol: '\hat{s}_{B^{*}}'
    description: 'net foreign assets to nominal GDP ratio, deviation'
    block: households
    predetermined: true
    notes: 'net foreign assets chosen at t: (272) is written s_B*(+1) = f(s_B*, ...)'
  - name: w
    paper_symbol: '\hat{w}'
    description: 'real wage (detrended), log deviation'
    block: labor
  - name: w_tau
    paper_symbol: '\hat{w}_{\tau}'
    description: 'after-tax real wage, log deviation'
    block: labor
  - name: mrs
    paper_symbol: '\widehat{mrs}'
    description: 'marginal rate of substitution consumption-leisure, log deviation'
    block: labor
  - name: 'n'
    paper_symbol: '\hat{n}'
    description: 'hours worked (employment), log deviation'
    block: labor
  - name: h_s
    paper_symbol: '\hat{h}^{s}'
    description: 'supply of domestic intermediate goods, deviation'
    block: production
  - name: k_s
    paper_symbol: '\hat{k}^{s}'
    description: 'capital services, log deviation'
    block: production
  - name: mc
    paper_symbol: '\widehat{mc}'
    description: 'real marginal cost of domestic firms (vs CPI), log deviation'
    block: production
  - name: R_f
    paper_symbol: '\hat{R}_{f}'
    description: 'gross interest rate on working capital, log deviation'
    block: production
  - name: pi_H
    paper_symbol: '\hat{\pi}_{H}'
    description: 'domestic intermediate goods inflation, deviation'
    block: pricing
  - name: mc_H
    paper_symbol: '\widehat{mc}^{H}'
    description: 'real marginal cost of domestic firms relative to domestic price index'
    block: pricing
  - name: p_H
    paper_symbol: '\hat{p}_{H}'
    description: 'relative price of domestic intermediate goods (vs CPI), log deviation'
    block: pricing
  - name: pi_IM
    paper_symbol: '\hat{\pi}_{IM}'
    description: 'import price inflation (local currency), deviation'
    block: pricing
  - name: mc_IM
    paper_symbol: '\widehat{mc}_{IM}'
    description: 'real marginal cost of foreign intermediate goods firms'
    block: pricing
  - name: p_IM
    paper_symbol: '\hat{p}_{IM}'
    description: 'relative price of imported goods (vs CPI), log deviation'
    block: pricing
  - name: h_C
    paper_symbol: '\hat{h}_{C}'
    description: 'domestic intermediate input into consumption good, log deviation'
    block: final_goods
  - name: im_C
    paper_symbol: '\widehat{im}_{C}'
    description: 'imported intermediate input into consumption good, log deviation'
    block: final_goods
  - name: Gamma_IMC_p
    paper_symbol: '\hat{\Gamma}_{IM^{C}}^{+}'
    description: 'import-share adjustment-cost term, consumption sector'
    block: final_goods
  - name: q_C
    paper_symbol: '\hat{q}_{C}'
    description: 'output of final private consumption good, log deviation'
    block: final_goods
  - name: h_I
    paper_symbol: '\hat{h}_{I}'
    description: 'domestic intermediate input into investment good, log deviation'
    block: final_goods
  - name: im_I
    paper_symbol: '\widehat{im}_{I}'
    description: 'imported intermediate input into investment good, log deviation'
    block: final_goods
  - name: Gamma_IMI_p
    paper_symbol: '\hat{\Gamma}_{IM^{I}t}^{+}'
    description: 'import-share adjustment-cost term, investment sector (printed variant)'
    block: final_goods
  - name: q_I
    paper_symbol: '\hat{q}_{I}'
    description: 'output of final investment good, log deviation'
    block: final_goods
  - name: p_I
    paper_symbol: '\hat{p}_{I}'
    description: 'relative price of investment good (vs CPI), log deviation'
    block: final_goods
  - name: h_G
    paper_symbol: '\hat{h}_{G}'
    description: 'domestic intermediate input into public consumption good'
    block: final_goods
  - name: im_G
    paper_symbol: '\widehat{im}_{G}'
    description: 'imported intermediate input into public consumption good'
    block: final_goods
  - name: Gamma_IMG_p
    paper_symbol: '\hat{\Gamma}_{IM^{G}}^{+}'
    description: 'import-share adjustment-cost term, public consumption sector'
    block: final_goods
  - name: q_G
    paper_symbol: '\hat{q}_{G}'
    description: 'output of final public consumption good, log deviation'
    block: final_goods
  - name: p_G
    paper_symbol: '\hat{p}_{G}'
    description: 'relative price of public consumption good, log deviation'
    block: final_goods
  - name: h_X
    paper_symbol: '\hat{h}_{X}'
    description: 'domestic intermediate input into exported good, log deviation'
    block: final_goods
  - name: im_X
    paper_symbol: '\widehat{im}_{X}'
    description: 'imported intermediate input into exported good, log deviation'
