steady_state:
  - name: s_ss
    expr: '1'
    paper_eq: '157.i1'
    page: 103
    notes: 'normalization of the real exchange rate'
  - name: s_D
    expr: '0'
    paper_eq: '157.i2'
    page: 103
    notes: 'zero profit share'
  - name: s_DX
    expr: '0'
    paper_eq: '157.i2'
    page: 103
    notes: 'zero profit share of exporters'
  - name: u_ss
    expr: '1'
    paper_eq: '(158)'
    page: 104
  - name: p_OIL_star_ss
    expr: '((1 - s_DX)/(varphi_star_ss*s_ss))^(1/omega_star)'
    paper_eq: '167.u1'
    page: 106
    notes: 'solves 167.u1 for the oil price'
  - name: p_IM_H
    expr: 'varphi_star_ss*p_OIL_star_ss^omega_star*s_ss*(1 - s_DX)^(-1)'
    paper_eq: '(159)'
    page: 104
    notes: '= 1 by 167.u1'
  - name: A_C
    expr: '(nu_C_ss + (1 - nu_C_ss)*p_IM_H^(1 - mu_C))^(1/(1 - mu_C))'
    paper_eq: '(160)'
    page: 105
  - name: A_I
    expr: '(nu_I_ss + (1 - nu_I_ss)*p_IM_H^(1 - mu_I))^(1/(1 - mu_I))'
    paper_eq: '(164)'
    page: 105
  - name: A_G
    expr: '(nu_G_ss + (1 - nu_G_ss)*p_IM_H^(1 - mu_G))^(1/(1 - mu_G))'
    paper_eq: '(165)'
    page: 105
  - name: A_X
    expr: '(nu_X_ss + (1 - nu_X_ss)*p_IM_H^(1 - mu_X))^(1/(1 - mu_X))'
    paper_eq: '(166)'
    page: 106
  - name: p_H_ss
    expr: 'A_C^(-1)'
    paper_eq: '(160)'
    page: 105
  - name: p_Y_ss
    expr: '(1 - s_DX)^(-1)*A_C^(-1)'
    paper_eq: '(161)'
    page: 105
  - name: p_IM_ss
    expr: 'varphi_star_ss*p_OIL_star_ss^omega_star*s_ss*(1 - s_DX)^(-1)*A_C^(-1)'
    paper_eq: '(162)'
    page: 105
  - name: mc_ss
    expr: '1/varphi_H_ss*A_C^(-1)'
    paper_eq: '(163)'
    page: 105
  - name: p_I_ss
    expr: 'A_C^(-1)*A_I'
    paper_eq: '(164)'
    page: 105
  - name: p_G_ss
    expr: 'A_C^(-1)*A_G'
    paper_eq: '(165)'
    page: 105
  - name: p_DX_ss
    expr: 'A_C^(-1)*A_X'
    paper_eq: '(166)'
    page: 106
  - name: p_X_ss
    expr: 'varphi_X_ss*p_DX_ss/(s_ss*p_Y_ss)'
    paper_eq: '(167)'
    page: 106
  - name: p_C_ss
    expr: '1'
    paper_eq: '(132)'
    page: 99
    notes: 'the CPI is the numeraire'
  - name: pi_ss
    expr: Pibar
    paper_eq: '(111), 109.i7'
    page: 96
    notes: 'steady-state inflation equals the target'
  - name: pi_star_ss
    expr: pi_ss
    paper_eq: '112.i1'
    page: 96
  - name: R_ss
    expr: 'g_z_ss*pi_ss/beta'
    paper_eq: '(168)'
    page: 106
  - name: r_star_ss
    expr: 'g_z_ss*pi_ss/beta'
    paper_eq: '(169)'
    page: 106
  - name: R_F_ss
    expr: '1 + nu_f_ss*(R_ss - 1)'
    paper_eq: '(170)'
    page: 106
  - name: Q_ss
    expr: p_I_ss
    paper_eq: '(171)'
    page: 106
  - name: r_K_ss
    expr: 'gamma_u_1*p_I_ss'
    paper_eq: '(172)'
    page: 107
  - name: w_ss
    expr: '(alpha^alpha*(1 - alpha)^(1 - alpha)/(1 + tau_W_f_ss)^(1 - alpha)*mc_ss*r_K_ss^(-alpha)*R_F_ss^(-(1 - alpha)))^(1/(1 - alpha))'
    paper_eq: '(173)'
    page: 107
  - name: s_TB_ss
    expr: '-s_FTR_ss'
    paper_eq: '(174)'
    page: 107
  - name: kN
    expr: 'alpha/(1 - alpha)*g_z_ss*(1 + tau_W_f_ss)*R_F_ss*w_ss/r_K_ss'
    paper_eq: '(175)'
    page: 107
    notes: 'k/N'
  - name: iN
    expr: '(1 - (1 - delta)/g_z_ss)*kN'
    paper_eq: '(176)'
    page: 107
    notes: 'i/N'
  - name: yN
    expr: '(1 - s_D)^(-1)*(g_z_ss^(-1)*kN)^alpha*mc_ss/p_Y_ss'
    paper_eq: '(177)'
    page: 107
    notes: 'y/N'
  - name: gN
    expr: 's_G*p_Y_ss/p_G_ss*yN'
    paper_eq: '(178)'
    page: 107
    notes: 'g/N'
  - name: cN
    expr: 'p_Y_ss*yN - p_I_ss*iN - dinv_ss*p_I_ss*yN - p_G_ss*gN - s_TB_ss*p_Y_ss*yN'
    paper_eq: '(179)'
    page: 108
    notes: 'c/N'
  - name: N_ss
    expr: '(phi_w_ss*(1 + w_tauC*tau_C_ss)*(1 - kappa/g_z_ss)*(1 - tau_N_ss - tau_W_h_ss)^(-1)*cN*w_ss^(-1))^(-(1/(zeta + 1)))'
    paper_eq: '(180)'
    page: 108
    notes: hours
  - name: c_ss
    expr: 'cN*N_ss'
    paper_eq: '(181)'
    page: 108
  - name: y_ss
    expr: 'yN*N_ss'
    paper_eq: '(182)'
    page: 108
  - name: g_ss
    expr: 'gN*N_ss'
    paper_eq: '(183)'
    page: 108
  - name: i_ss
    expr: 'iN*N_ss'
    paper_eq: '(184)'
    page: 108
  - name: k_ss
    expr: 'kN*N_ss'
    paper_eq: '(185)'
    page: 109
  - name: k_s_ss
    expr: k_ss
    paper_eq: '(186)'
    page: 109
  - name: h_s_ss
    expr: y_ss
    paper_eq: '(187)'
    page: 109
  - name: h_ss
    expr: h_s_ss
    paper_eq: '(188)'
    page: 109
  - name: q_C_ss
    expr: c_ss
    paper_eq: '(189)'
    page: 109
  - name: q_I_ss
    expr: 'i_ss + dinv_ss*y_ss'
    paper_eq: '(190)'
    page: 109
  - name: q_G_ss
    expr: g_ss
    paper_eq: '(191)'
    page: 109
  - name: h_C_ss
    expr: 'nu_C_ss*p_H_ss^(-mu_C)*q_C_ss'
    paper_eq: '(192)'
    page: 109
  - name: h_I_ss
    expr: 'nu_I_ss*(p_H_ss/p_I_ss)^(-mu_I)*q_I_ss'
    paper_eq: '(193)'
    page: 109
  - name: h_G_ss
    expr: 'nu_G_ss*(p_H_ss/p_G_ss)^(-mu_G)*q_G_ss'
    paper_eq: '(194)'
    page: 109
  - name: im_C_ss
    expr: '(1 - nu_C_ss)*p_IM_ss^(-mu_C)*q_C_ss'
    paper_eq: '(195)'
    page: 109
  - name: im_I_ss
    expr: '(1 - nu_I_ss)*(p_IM_ss/p_I_ss)^(-mu_I)*q_I_ss'
    paper_eq: '(196)'
    page: 109
  - name: im_G_ss
    expr: '(1 - nu_G_ss)*(p_IM_ss/p_G_ss)^(-mu_G)*q_G_ss'
    paper_eq: '(197)'
    page: 109
  - name: h_X_ss
    expr: 'h_ss - h_C_ss - h_I_ss - h_G_ss'
    paper_eq: '(198)'
    page: 110
  - name: q_X_ss
    expr: 'nu_X_ss^(-1)*(p_H_ss/p_DX_ss)^mu_X*h_X_ss'
    paper_eq: '(199)'
    page: 110
  - name: im_X_ss
    expr: '(1 - nu_X_ss)*(p_IM_ss/p_DX_ss)^(-mu_X)*q_X_ss'
    paper_eq: '(200)'
    page: 110
    printed: '(1 - nu_X_ss)*(p_IM_ss/p_DX_ss)^(-mu_G)*q_X_ss'
    decision: D33
  - name: im_ss
    expr: 'im_C_ss + im_I_ss + im_G_ss + im_X_ss'
    paper_eq: '(201)'
    page: 110
  - name: s_IM_ss
    expr: 'p_IM_ss*im_ss/(p_Y_ss*y_ss)'
    paper_eq: '(202)'
    page: 110
  - name: s_X_ss
    expr: 's_TB_ss + s_IM_ss'
    paper_eq: '(203)'
    page: 110
  - name: x_ss
    expr: 's_X_ss*y_ss/(s_ss*p_X_ss)'
    paper_eq: '(204)'
    page: 110
  - name: wt_star_ss
    expr: '(nu_star_ss*ztilde_ss)^(-1)*p_Xc_star_ss^(-mu_star)*p_X_ss^mu_star*x_ss'
    paper_eq: '(205)'
    page: 110
  - name: psi
    expr: '((1 - s_D)*p_Y_ss/mc_ss - 1)*y_ss'
    paper_eq: '(208)'
    page: 111
    notes: 'fixed cost of domestic firms'
  - name: psi_X
    expr: '(s_ss*p_X_ss*p_Y_ss/p_DX_ss - 1)*x_ss - s_DX*p_Y_ss*y_ss/p_DX_ss'
    paper_eq: '(209)'
    page: 111
    notes: 'fixed cost of exporters'
  - name: lambda_ss
    expr: '(1 - kappa/g_z_ss)^(-1)/(1 + w_tauC*tau_C_ss)/c_ss'
    paper_eq: '(210)'
    page: 111
  - name: p_Y_M_ss
    expr: '(1 + w_tauC*tau_C_ss)*c_ss/y_ss + p_I_ss*i_ss/y_ss + dinv_ss*p_I_ss + p_G_ss*g_ss/y_ss + s_TB_ss*p_Y_ss'
