reporting:
  # How the paper reports results; used by tests/test_replication.py. Not part of the model.
  irf:
    source: docs/paper/data/irf (digitized Figures 6-18; series 'mean' is the posterior mean response)
    horizon: 20
    impact_quarter: 1
    shock_size: one standard deviation
    notes: 'Scales chosen by comparing with the figures: inflation panels are quarterly (x100, not x400), the interest rate is annualized (x400) and the real exchange rate panel is s (the GDP-deflator based rate of (217)), which fits better than s_C.'
    panels:
      - {panel: Output, variable: y, scale: 100, units: '% deviation'}
      - {panel: Consumption, variable: c, scale: 100, units: '% deviation'}
      - {panel: 'Fixed investment', variable: i, scale: 100, units: '% deviation'}
      - {panel: Exports, variable: x, scale: 100, units: '% deviation'}
      - {panel: Imports, variable: im, scale: 100, units: '% deviation'}
      - {panel: 'Hours worked', variable: n, scale: 100, units: '% deviation'}
      - {panel: 'Interest rate', variable: r, scale: 400, units: 'annualized percentage points'}
      - {panel: 'Real wage', variable: w, scale: 100, units: '% deviation'}
      - {panel: 'Real exchange rate', variable: s, scale: 100, units: '% deviation (GDP-deflator based s, not s_C)'}
      - {panel: 'CPI inflation', variable: pi_C, scale: 100, units: 'quarterly percentage points'}
      - {panel: 'Domestic inflation', variable: pi_H, scale: 100, units: 'quarterly percentage points'}
      - {panel: 'Imported inflation', variable: pi_IM, scale: 100, units: 'quarterly percentage points'}
    figures:
      - {figure: 6, shock: eta_R, file: 'fig06_interest_rate.csv', title: 'Interest rate (monetary policy) shock'}
      - {figure: 7, shock: eta_RPstar, file: 'fig07_external_risk_premium.csv', title: 'External risk premium shock'}
      - {figure: 8, shock: eta_RP, file: 'fig08_symmetric_premium.csv', title: 'Symmetric (domestic demand) premium shock'}
      - {figure: 9, shock: eta_Ystar, file: 'fig09_foreign_demand.csv', title: 'Foreign demand shock'}
      - {figure: 10, shock: eta, file: 'fig10_transitory_technology.csv', title: 'Transitory technology shock'}
      - {figure: 11, shock: eta_varphiH, file: 'fig11_domestic_price_markup.csv', title: 'Domestic price markup shock'}
      - {figure: 12, shock: eta_varphistar, file: 'fig12_import_price_markup.csv', title: 'Import price markup shock'}
      - {figure: 13, shock: eta_OIL, file: 'fig13_oil_price.csv', title: 'Oil price shock'}
      - {figure: 14, shock: eta_I, file: 'fig14_investment_specific_technology.csv', title: 'Investment-specific technology shock'}
      - {figure: 15, shock: eta_nustar, file: 'fig15_export_share.csv', title: 'Export share shock'}
      - {figure: 16, shock: eta_nu, file: 'fig16_home_bias.csv', title: 'Home bias shock'}
      - {figure: 17, shock: eta_varphiW, file: 'fig17_wage_markup.csv', title: 'Wage markup shock'}
      - {figure: 18, shock: eta_DINV, file: 'fig18_inventories_investment_demand.csv', title: 'Inventory investment shock'}
  variance_decomposition:
    source: docs/paper/data/table7_variance_decomposition.csv (Table 7, pages 69-70)
    horizons: [1, 4, null]
    variables:
      - {table: 'Interest rate', variable: r_OB}
      - {table: Inflation, variable: Delta_P_C}
      - {table: 'Real exchange rate', variable: s}
      - {table: 'Real wage', variable: w}
      - {table: 'Hours worked', variable: n}
      - {table: Output, variable: y}
      - {table: Consumption, variable: c}
      - {table: Investment, variable: i}
      - {table: Exports, variable: x}
      - {table: Imports, variable: im}
    shocks:
      - {table: 'Transitory techn.', shock: eta}
      - {table: 'Permanent techn.', shock: eta_gz}
      - {table: 'Symmetric prem.', shock: eta_RP}
      - {table: 'External prem.', shock: eta_RPstar}
      - {table: 'Dom. prem.', shock: eta_DRP}
      - {table: Consumption, shock: eta_C}
      - {table: 'Inv. techn.', shock: eta_I}
      - {table: 'Inventory inv.', shock: eta_DINV}
      - {table: Government, shock: eta_G}
      - {table: 'Export share', shock: eta_nustar}
      - {table: 'Home bias', shock: eta_nu}
      - {table: 'Domestic markup', shock: eta_varphiH}
      - {table: 'Import markup', shock: eta_varphistar}
      - {table: 'Wage markup', shock: eta_varphiW}
      - {table: 'Export markup', shock: eta_varphiX}
      - {table: 'Foreign transfers', shock: eta_FTR}
      - {table: 'Interest rate', shock: eta_R}
      - {table: 'Inf. target', shock: eta_Pibar}
      - {table: 'Consumption tax', shock: eta_tauC}
      - {table: 'Foreign demand', shock: eta_Ystar}
      - {table: 'Foreign supply', shock: eta_Pistar}
      - {table: 'Foreign interest rate', shock: eta_Rstar}
      - {table: 'World trade', shock: epsilon_IMstar}
      - {table: 'Oil price', shock: eta_OIL}
      - {table: 'Foreign LR rate', shock: eta_fwdstar}
